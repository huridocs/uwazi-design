name: Deploy prototype to GitHub Pages

# The prototype is a static Vite build with no backend — it can just be a URL.
# TWO builds go out together: `main` at the site root and `playground` under
# /playground/, so the reduced branch and the full one are both readable.
#
# A push to EITHER branch rebuilds BOTH. That is not redundancy: Pages replaces
# the whole site on every deploy, so an artifact containing only the branch that
# moved would delete the other branch's build.
#
# Only main DEPLOYS, though — the `github-pages` environment's branch policy
# says so. A playground push builds, proves itself, and then asks main to run;
# main's run publishes both.
on:
  push:
    branches: [main, playground]
  workflow_dispatch:

# Pages needs these; the token is scoped per-run, nothing long-lived is stored.
# `actions: write` is for the one step below that re-triggers this workflow on
# main after a playground push.
permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Don't cancel a running one — a half-finished deploy is
# worse than a slightly stale site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Both branches are checked out by explicit ref. The push that triggered
      # the run must NOT decide what gets built — a push to playground still
      # has to rebuild main's copy from main.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout playground
        uses: actions/checkout@v4
        with:
          ref: playground
          path: playground

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # Two lockfiles, two trees — the cache key covers both so a change in
          # either invalidates it.
          cache-dependency-path: |
            main/app/package-lock.json
            playground/app/package-lock.json

      - name: Install (main)
        working-directory: main/app
        run: npm ci

      - name: Typecheck (main)
        working-directory: main/app
        run: npx tsc --noEmit

      - name: Build (main)
        working-directory: main/app
        # The project site lives at /<repo>/ — vite.config.ts reads VITE_BASE,
        # and utils/asset.ts resolves every public/ asset against it.
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Install (playground)
        working-directory: playground/app
        run: npm ci

      - name: Typecheck (playground)
        working-directory: playground/app
        run: npx tsc --noEmit

      - name: Build (playground)
        working-directory: playground/app
        env:
          VITE_BASE: /${{ github.event.repository.name }}/playground/
        run: npm run build

      - name: Assemble site
        # main at the root, playground nested under it. Each build gets its own
        # 404.html copied from its own index.html: no router today, but a deep
        # link or a refresh then lands on the app it belongs to rather than on
        # GitHub's 404 page — and, under /playground/, on the RIGHT app.
        run: |
          mkdir -p site
          cp -r main/app/dist/. site/
          cp site/index.html site/404.html
          mkdir -p site/playground
          cp -r playground/app/dist/. site/playground/
          cp site/playground/index.html site/playground/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # A push to playground gets no deploy of its own (see the deploy job), so
      # it asks main to run instead. That run rebuilds both trees from their
      # tips — playground's included — and deploys, so the site still refreshes
      # after a playground push, just one hop later. Guarded on the ref, and the
      # run it starts is on main, so this step cannot re-trigger itself.
      - name: Ask main to deploy
        if: github.ref == 'refs/heads/playground'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo ${{ github.repository }}

  deploy:
    needs: build
    # Only main deploys. The `github-pages` environment carries a deployment
    # branch policy naming main, so a run from playground CANNOT deploy to it —
    # it failed here with the build already green, which reads as a broken
    # branch when nothing is broken. Working inside that policy rather than
    # widening it: the build above proves playground compiles, and the dispatch
    # step hands the publish to main, which is allowed to do it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
